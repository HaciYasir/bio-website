<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yasir bio</title>

<!-- Font Awesome icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { overflow: hidden !important; }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #d4a026;
  --gold-light: #f0d060;
  --gold-dark: #a07818;
  --gold-glow: rgba(212, 160, 38, 0.6);
  --bg-dark: #0a0a0f;
  --card-bg: rgba(15, 15, 25, 0.55);
  --card-border: rgba(212, 160, 38, 0.3);
  --text-primary: #e8e0d0;
  --text-secondary: #a09880;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-dark);
  font-family: 'Rajdhani', sans-serif;
  color: var(--text-primary);
  cursor: none;
}

/* LOADING SCREEN */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg-dark);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.8s, visibility 0.8s;
  cursor: pointer;
}
#loader p {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; letter-spacing: 4px; color: var(--gold);
  text-transform: uppercase;
}

/* CUSTOM CURSOR */
#cursor-glow {
  position: fixed; pointer-events: none; z-index: 10000;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,160,38,0.12) 0%, rgba(212,160,38,0.04) 35%, transparent 70%);
  transform: translate(-50%, -50%);
  transition: width 0.3s, height 0.3s;
  mix-blend-mode: screen;
}
#cursor-dot {
  position: fixed; pointer-events: none; z-index: 10001;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow), 0 0 30px rgba(212,160,38,0.3);
  transform: translate(-50%, -50%);
}

/* VIDEO BACKGROUND */
#bg-video {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.85 !important;
  filter: brightness(0.9) !important;
}
#bg-fallback {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(135deg, #0a0a1a 0%, #101020 50%, #0a0a15 100%);
}

/* PARTICLE CANVAS (KAR YAĞIŞI & İMLEÇ TAKİBİ) */
#particles-canvas {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;
}

/* AUDIO VISUALIZER (TAM EKRAN EN ALTTA) */
#audio-viz {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100vw;
  height: 110px;
  z-index: 2;
  pointer-events: none;
  opacity: 0.8;
}

/* MAIN LAYOUT */
#app {
  position: relative; z-index: 5;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}

/* 3D GLASSMORPHIC CARD */
.card-wrapper { perspective: 1200px; }
.main-card {
  position: relative;
  width: 420px;
  max-height: 90vh;
  overflow-y: auto; overflow-x: hidden;
  padding: 36px 32px 28px;
  border-radius: 24px;
  background: var(--card-bg);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border: 1px solid var(--card-border);
  box-shadow:
    0 0 40px rgba(212,160,38,0.08),
    0 0 80px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.06);
  transform-style: preserve-3d;
  transition: transform 0.1s ease-out, box-shadow 0.3s;
  will-change: transform;
}
.main-card::-webkit-scrollbar { width: 4px; }
.main-card::-webkit-scrollbar-track { background: transparent; }
.main-card::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 2px; }

.main-card::before {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 26px;
  background: conic-gradient(from var(--glow-angle, 0deg),
    transparent 0%, var(--gold) 10%, transparent 20%,
    transparent 50%, var(--gold-dark) 60%, transparent 70%);
  z-index: -1;
  opacity: 0.5;
  animation: rotateGlow 6s linear infinite;
  filter: blur(3px);
}
@property --glow-angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}
@keyframes rotateGlow { to { --glow-angle: 360deg; } }

/* PROFILE SECTION */
.profile-section {
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: 18px;
}
.avatar-container {
  position: relative; width: 110px; height: 110px; margin-bottom: 16px;
}
.avatar-halo {
  position: absolute; inset: -6px;
  border-radius: 50%;
  background: conic-gradient(var(--gold), var(--gold-light), var(--gold-dark), var(--gold));
  animation: spin 4s linear infinite;
  filter: blur(1px);
}
@keyframes spin { to { transform: rotate(360deg); } }
.avatar-halo-inner {
  position: absolute; inset: 2px;
  border-radius: 50%;
  background: var(--bg-dark);
}
.avatar-img {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  border-radius: 50%; object-fit: cover;
  border: 3px solid var(--bg-dark);
}
.status-dot {
  position: absolute; bottom: 4px; right: 4px; z-index: 2;
  width: 20px; height: 20px; border-radius: 50%;
  border: 3px solid var(--bg-dark);
  background: #747f8d; transition: background 0.4s;
}
.status-dot.online { background: #43b581; box-shadow: 0 0 8px rgba(67,181,129,0.6); }
.status-dot.idle { background: #faa61a; box-shadow: 0 0 8px rgba(250,166,26,0.6); }
.status-dot.dnd { background: #f04747; box-shadow: 0 0 8px rgba(240,71,71,0.6); }
.status-dot.offline { background: #747f8d; }

.username {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px; font-weight: 700;
  letter-spacing: 2px; color: var(--text-primary);
  text-shadow: 0 0 20px rgba(212,160,38,0.3); margin-bottom: 4px;
}
.bio {
  font-size: 14px; color: var(--text-secondary);
  text-align: center; max-width: 320px; line-height: 1.5; margin-bottom: 12px;
  font-family: 'JetBrains Mono', monospace;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 16px; border-radius: 20px;
  background: linear-gradient(135deg, rgba(212,160,38,0.15), rgba(212,160,38,0.05));
  border: 1px solid rgba(212,160,38,0.35);
  font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 600;
  letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 18px;
}

/* TECH TAGS */
.tech-tags {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 8px; margin-bottom: 22px;
}
.tech-tag {
  padding: 4px 12px; border-radius: 6px;
  background: rgba(212,160,38,0.08); border: 1px solid rgba(212,160,38,0.2);
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
  color: var(--gold-light); letter-spacing: 1px; transition: all 0.3s;
}
.tech-tag:hover {
  background: rgba(212,160,38,0.2); border-color: var(--gold);
  box-shadow: 0 0 12px rgba(212,160,38,0.2); transform: translateY(-2px);
}

/* LANYARD CARD */
.presence-card {
  width: 100%; padding: 14px; border-radius: 14px;
  background: rgba(0,0,0,0.35); border: 1px solid rgba(212,160,38,0.12);
  margin-bottom: 20px; transition: all 0.4s; min-height: 60px;
}
.presence-header {
  font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 3px;
  color: var(--gold-dark); text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.presence-header .pulse-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
.presence-body { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.presence-body:last-child { margin-bottom: 0; }
.presence-icon {
  width: 48px; height: 48px; border-radius: 10px;
  background: rgba(212,160,38,0.1); border: 1px solid rgba(212,160,38,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--gold); flex-shrink: 0; overflow: hidden;
}
.presence-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.presence-info { flex: 1; min-width: 0; }
.presence-title {
  font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600;
  color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.presence-detail {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.presence-empty {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary);
  text-align: center; padding: 8px 0; opacity: 0.6;
}

/* SOCIAL LINKS */
.social-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.social-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: rgba(212,160,38,0.06); border: 1px solid rgba(212,160,38,0.15);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); font-size: 18px; text-decoration: none;
  transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: none;
}
.social-btn:hover {
  color: var(--gold); background: rgba(212,160,38,0.15); border-color: var(--gold);
  box-shadow: 0 0 20px rgba(212,160,38,0.25); transform: translateY(-4px);
}

/* MUSIC PLAYER */
.player-bar {
  display: flex; align-items: center; gap: 15px;
  padding: 12px 18px; border-radius: 14px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(212,160,38,0.1);
}
.play-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold)); border: none;
  display: flex; align-items: center; justify-content: center;
  color: #0a0a0f; font-size: 15px; cursor: pointer; transition: all 0.3s; flex-shrink: 0;
}
.play-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--gold-glow); }
.volume-container { display: flex; align-items: center; gap: 10px; flex: 1; }
.volume-container i { color: var(--gold-dark); font-size: 1.2rem; flex-shrink: 0; }
.volume-slider {
  flex: 1; height: 6px; -webkit-appearance: none; appearance: none;
  border-radius: 3px; background: rgba(212,160,38,0.2); outline: none; cursor: pointer;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold); cursor: pointer; box-shadow: 0 0 8px var(--gold-glow);
}

#scanlines {
  position: fixed; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.fade-in-up { animation: fadeInUp 0.8s ease forwards; }
.delay-1 { animation-delay: 0.1s; opacity: 0; }
.delay-2 { animation-delay: 0.2s; opacity: 0; }
.delay-3 { animation-delay: 0.3s; opacity: 0; }
.delay-5 { animation-delay: 0.5s; opacity: 0; }

@media (max-width: 480px) {
  .main-card { width: 92vw; padding: 28px 20px 22px; }
  .username { font-size: 18px; }
}
</style>

<body>

<!-- GİRİŞ EKRANI -->
<div id="loader">

</div>

<!-- ÖZEL İMLEÇ -->

<!-- ARKA PLAN VİDEOSU -->

<!-- MÜZİK -->

</audio>

<!-- ANA UYGULAMA -->
<div id="app">
  <div class="card-wrapper">
    <div class="main-card" id="main-card">

      <!-- Profil -->
      <div class="profile-section fade-in-up delay-1">

          <img src="pp.png" alt="Profil Resmi" class="avatar-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23191920%22 width=%22100%22 height=%22100%22/><text x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23d4a026%22 font-size=%2238%22 font-family=%22monospace%22>Y</text></svg>'">
          <div class="status-dot" id="discord-status" title="Discord Status"></div>

          <div class="pulse-dot"></div>

        </div>

      <!-- Sosyal Medya -->

        <a href="https://github.com/HaciYasir" target="_blank" class="social-btn" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="discord://-/users/992152470576955392" target="_blank" class="social-btn" title="Discord">
          <i class="fab fa-discord"></i>
        </a>
      </div>

      <!-- Müzik Çalar Panel -->
      <div class="player-bar fade-in-up delay-5">
        <button class="play-btn" id="play-btn">
          <i class="fas fa-play" id="play-icon"></i>
        </button>
        
        <div class="volume-container">
          <i class="fas fa-volume-up" id="vol-icon"></i>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="20">
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const CONFIG = { DISCORD_ID: '992152470576955392' };



/* 3D TILT & CUSTOM CURSOR */
const cursorGlow = document.getElementById('cursor-glow');
const cursorDot = document.getElementById('cursor-dot');
const card = document.getElementById('main-card');
let cursorParticles = [];

document.addEventListener('mousemove', e => {
  if (cursorDot) { cursorDot.style.left = e.clientX + 'px'; cursorDot.style.top = e.clientY + 'px'; }
  if (cursorGlow) { cursorGlow.style.left = e.clientX + 'px'; cursorGlow.style.top = e.clientY + 'px'; }

  if (card) {
    const rotateX = ((e.clientY - window.innerHeight / 2) / (window.innerHeight / 2)) * -10;
    const rotateY = ((e.clientX - window.innerWidth / 2) / (window.innerWidth / 2)) * 10;
    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  }

  // İMLEÇ PARILTI EFEKTİ (TRAIL)
  cursorParticles.push({
    x: e.clientX,
    y: e.clientY,
    size: Math.random() * 3 + 1.5,
    speedX: (Math.random() - 0.5) * 1.2,
    speedY: (Math.random() - 0.5) * 1.2,
    opacity: 1
  });
});

/* KAR YAĞIŞI & İMLEÇ PARILTI MOTORU */
const pCanvas = document.getElementById('particles-canvas');
const pCtx = pCanvas.getContext('2d');
let snowflakes = [];

function resizePCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizePCanvas);
resizePCanvas();

// Snowflakes init
for (let i = 0; i < 60; i++) {
  snowflakes.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    radius: Math.random() * 2 + 1,
    speedY: Math.random() * 0.8 + 0.4,
    speedX: Math.random() * 0.4 - 0.2,
    opacity: Math.random() * 0.6 + 0.3
  });
}

function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

  // KAR YAĞIŞI ÇİZİMİ
  snowflakes.forEach(flake => {
    pCtx.beginPath();
    pCtx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(240, 224, 180, ${flake.opacity})`;
    pCtx.fill();

    flake.y += flake.speedY;
    flake.x += flake.speedX;

    if (flake.y > pCanvas.height) {
      flake.y = -5;
      flake.x = Math.random() * pCanvas.width;
    }
  });

  // İMLEÇ EFEKTİ ÇİZİMİ
  for (let i = 0; i < cursorParticles.length; i++) {
    let p = cursorParticles[i];
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(212, 160, 38, ${p.opacity})`;
    pCtx.fill();

    p.x += p.speedX;
    p.y += p.speedY;
    p.size *= 0.94;
    p.opacity -= 0.03;

    if (p.opacity <= 0 || p.size <= 0.2) {
      cursorParticles.splice(i, 1);
      i--;
    }
  }

  requestAnimationFrame(animateParticles);
}
animateParticles();

/* SES & EKRAN EN ALTI EKOLAYZER */
const audio = document.getElementById('bg-music');
const loader = document.getElementById('loader');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const volSlider = document.getElementById('volume-slider');

let audioCtx, analyser, dataArray;
let isPlaying = false;

if (audio) audio.volume = 0.2;

if (loader) {
  loader.addEventListener('click', () => {
    if (audio) {
      audio.play().then(() => {
        isPlaying = true;
        if (playIcon) playIcon.className = 'fas fa-pause';
        startVisualizer();
      }).catch(err => console.log("Ses başlatma hatası:", err));
    }
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 500);
  });
}

if (playBtn && audio) {
  playBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isPlaying) {
      audio.pause();
      if (playIcon) playIcon.className = 'fas fa-play';
    } else {
      audio.play();
      if (playIcon) playIcon.className = 'fas fa-pause';
    }
    isPlaying = !isPlaying;
  });
}

if (volSlider && audio) {
  volSlider.addEventListener('input', e => { audio.volume = e.target.value / 100; });
}

function startVisualizer() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    drawVisualizer();
  } catch (e) {
    console.log("Visualizer hatası:", e);
  }
}

function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);

  const canvas = document.getElementById('audio-viz');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  if (canvas.width !== window.innerWidth || canvas.height !== canvas.offsetHeight) {
    canvas.width = window.innerWidth;
    canvas.height = canvas.offsetHeight || 110;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bars = 50;
  const gap = 4;
  const barWidth = (canvas.width - ((bars - 1) * gap)) / bars;

  for (let i = 0; i < bars; i++) {
    const barHeight = (dataArray[i] / 255) * canvas.height;
    const gradient = ctx.createLinearGradient(0, canvas.height - barHeight, 0, canvas.height);
    gradient.addColorStop(0, '#f0d060');
    gradient.addColorStop(1, '#d4a026');

    ctx.fillStyle = gradient;
    const xPosition = i * (barWidth + gap);
    ctx.fillRect(xPosition, canvas.height - barHeight, barWidth, Math.max(barHeight, 3));
  }
}

/* LANYARD DISCORD DURUMU (GELİŞMİŞ LOGO ÇÖZÜCÜ) */
const statusDot = document.getElementById('discord-status');
const presenceContent = document.getElementById('presence-content');

function connectLanyard() {
  const ws = new WebSocket('wss://api.lanyard.rest/socket');

  ws.onopen = () => {
    ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: CONFIG.DISCORD_ID } }));
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.t === 'INIT_STATE' || data.t === 'PRESENCE_UPDATE') {
      const presence = data.d;
      if (statusDot) statusDot.className = `status-dot ${presence.discord_status || 'offline'}`;
      updatePresenceUI(presence);
    }
  };

  ws.onclose = () => setTimeout(connectLanyard, 5000);
}

// Popüler oyunlar için yedek kapak görselleri listesi 🖼️
const GAME_COVERS = {
  'euro truck simulator 2': 'https://cdn.cloudflare.steamstatic.com/steam/apps/227300/header.jpg',
  'ets2': 'https://cdn.cloudflare.steamstatic.com/steam/apps/227300/header.jpg',
  'counter-strike 2': 'https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg',
  'cs2': 'https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg',
  'grand theft auto v': 'https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg',
  'gta v': 'https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg',
  'valorant': 'https://images.contentstack.io/v3/assets/bltb65488c70f7f02b0/blt2b1c4161f3640203/631b9e59997455110d732c58/Valorant_2022_E5A2_PlayVALORANT_ContentStackThumbnail_1200x675.jpg',
  'minecraft': 'https://assets.xboxservices.com/assets/77/f7/77f72eb3-41a4-44a8-9d29-cb68bcf82c81.jpg?n=Minecraft_GLP-Page-Hero-0_1083x609.jpg',
  'league of legends': 'https://cmsassets.rgpub.io/sanity/images/ds13aw3g/43_live/22813589dd97b5e8c1875e53303cb50198f1f705-1920x1080.jpg'
};

function updatePresenceUI(p) {
  if (!presenceContent) return;
  if (!p || (!p.activities.length && !p.spotify)) {
    presenceContent.innerHTML = `<div class="presence-empty">Şu an aktif bir etkinlik yok</div>`;
    return;
  }

  let html = '';

  // 1. Spotify varsa ekle 🎵
  if (p.spotify) {
    html += `
      <div class="presence-body">
        <div class="presence-icon">
          <img src="${p.spotify.album_art_url}" alt="Album Art" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fab fa-spotify\'></i>';">
        </div>
        <div class="presence-info">
          <div class="presence-title">${p.spotify.song}</div>
          <div class="presence-detail">${p.spotify.artist}</div>
        </div>
      </div>`;
  }

  // 2. Oyunlar ve Etkinlikler 🎮
  if (p.activities && p.activities.length > 0) {
    p.activities.forEach(act => {
      if (act.type !== 4 && act.name.toLowerCase() !== 'spotify') {
        let iconHtml = '<i class="fas fa-gamepad"></i>';
        let imgUrl = '';
        const nameLower = act.name.toLowerCase();

        // A) Önce Discord/Lanyard'dan resim geliyor mu kontrol et
        if (act.assets) {
          let rawImg = act.assets.large_image || act.assets.small_image;
          if (rawImg) {
            if (rawImg.startsWith('spotify:')) {
              imgUrl = `https://i.scdn.co/image/${rawImg.replace('spotify:', '')}`;
            } else if (rawImg.startsWith('mp:external/')) {
              imgUrl = `https://media.discordapp.net/${rawImg.replace('mp:', '')}`;
            } else if (rawImg.startsWith('mp:')) {
              imgUrl = `https://media.discordapp.net/external/${rawImg.replace('mp:', '')}`;
            } else if (rawImg.startsWith('http')) {
              imgUrl = rawImg;
            } else if (act.application_id) {
              imgUrl = `https://cdn.discordapp.com/app-assets/${act.application_id}/${rawImg}.png`;
            }
          }
        }

        // B) Veri gelmediyse Yedek Oyun Kapağı Listemizden çek! 🎯
        if (!imgUrl) {
          for (let gameKey in GAME_COVERS) {
            if (nameLower.includes(gameKey)) {
              imgUrl = GAME_COVERS[gameKey];
              break;
            }
          }
        }

        if (imgUrl) {
          iconHtml = `<img src="${imgUrl}" alt="Activity" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fas fa-gamepad\'></i>';">`;
        }

        let subText = act.details || act.state || 'Oynuyor';
        html += `
          <div class="presence-body">
            <div class="presence-icon">${iconHtml}</div>
            <div class="presence-info">
              <div class="presence-title">${act.name}</div>
              <div class="presence-detail">${subText}</div>
            </div>
          </div>`;
      }
    });
  }

  presenceContent.innerHTML = html || `<div class="presence-empty">Şu an aktif bir etkinlik yok</div>`;
}

connectLanyard();
</script>
